[project]
name = "api-inventario-python"
version = "1.0.0"
description = "API REST de inventario y ventas con FastAPI y PostgreSQL"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Juan David Gamero Tatis" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Aviso interno de Starlette sobre su cliente de pruebas; no afecta a la API
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["B008"]  # FastAPI usa Depends() como valor por defecto

[tool.ruff.lint.isort]
known-first-party = ["app"]
