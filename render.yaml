# Despliegue de la API y la base de datos en Render (Blueprint)
services:
  - type: web
    name: api-inventario
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: ./scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: inventario-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DATA
        value: 'true'
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: inventario-db
    plan: free
